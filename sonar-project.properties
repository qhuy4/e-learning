sonar.projectKey=qhuy4_e-learning
sonar.organization=qhuy4
sonar.host.url=https://sonarcloud.io

# Scan FE + BE
sonar.sources=fe,be
sonar.sourceEncoding=UTF-8

# Ignore files
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/.nuxt/**,\
  **/coverage/**,\
  **/.output/**,\
  **/generated/**,\
  **/*.min.js,\
  **/*.map,\
  **/*.d.ts,\
  **/package-lock.json,\
  **/pnpm-lock.yaml,\
  **/yarn.lock

# Test files
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Coverage exclusions
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.tsx,\
  **/*.test.tsx,\
  **/main.ts,\
  **/generated/**