
name: PiEMind Backend CI

on:
  push:
    branches:
      - main
      - dev
      - production
    paths:
      - "be/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
      - dev
    paths:
      - "be/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    name: NestJS CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm run test --if-present -- --runInBand

      - name: Build NestJS
        run: npm run build
